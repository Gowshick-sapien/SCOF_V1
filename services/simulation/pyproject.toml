[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scof-simulation"
version = "0.1.0"
description = "SCOF Profile-Driven Synthetic Supply Chain Simulation Service"
authors = [{ name = "SCOF Team" }]
requires-python = ">=3.11"
dependencies = [
    "faker>=20.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "scof-shared"
]

[tool.setuptools.packages.find]
where = ["."]
