[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scof-inventory-agent"
version = "1.0.0"
description = "SCOF Inventory Agent Microservice"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "requests>=2.31.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
