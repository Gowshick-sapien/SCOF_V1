[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scof-etl"
version = "0.1.0"
description = "SCOF Deliverable D2 Modular Knowledge & Data Layer ETL Pipeline Service"
authors = [{name = "SCOF Team"}]
dependencies = [
    "neo4j>=5.14.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.2.4",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0"
]
