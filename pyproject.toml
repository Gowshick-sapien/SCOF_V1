[project]
name = "scof-monorepo"
version = "0.1.0"
description = "Supply Chain Cognitive Orchestration Framework"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["shared", "services"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["shared", "services/simulation"]

[tool.pyright]
extraPaths = ["shared", "services/simulation"]


