fast_path:
  confidence_threshold: 0.85
  max_impact_level: "LOW"

slow_path:
  min_confidence: 0.50
  max_impact_level: "HIGH"

human_escalation:
  consensus_stability_min: 0.40
  impact_level_trigger: "CRITICAL"

calibration:
  frequency: "every_100_decisions"
  min_kappa: 0.70

partial_bundle:
  min_participating_agents: 2

accuracy:
  default_accuracy: 0.50
  window_size: 50

impact_mapping:
  "critical": "CRITICAL"
  "business-critical": "CRITICAL"
  "severe": "HIGH"
  "significant": "HIGH"
  "high": "HIGH"
  "moderate": "MEDIUM"
  "minor": "LOW"
  "negligible": "LOW"
