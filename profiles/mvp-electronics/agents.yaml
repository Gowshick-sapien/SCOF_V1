active_agents:
  - id: "demand-agent"
    name: "Demand Forecast Agent"
    port: 8011
    confidence_floor: 0.60
    ensemble_weights:
      xgboost: 0.6
      statistical: 0.4
    forecast_horizon_days: 14
    mcp_tools:
      - read_historical_demand
      - read_demand_disruptions
      - read_product_catalog

  - id: "inventory-agent"
    name: "Inventory Agent"
    port: 8012
    confidence_floor: 0.65
    ensemble_weights:
      xgboost: 0.6
      statistical: 0.4
    forecast_horizon_days: 14
    mcp_tools:
      - read_stock_levels
      - read_reorder_points
      - read_inbound_shipments
      - read_inventory_disruptions

  - id: "supplier-agent"
    name: "Supplier Intelligence Agent"
    port: 8013
    confidence_floor: 0.55
    ensemble_weights:
      reliability_scorer: 0.6
      rule_scorer: 0.4
    mcp_tools:
      - query_supplier_graph
      - read_delivery_history
      - query_alternate_suppliers
      - read_supplier_disruptions

  - id: "transport-agent"
    name: "Transportation Agent"
    port: 8014
    confidence_floor: 0.50
    ensemble_weights:
      delay_predictor: 0.6
      route_scorer: 0.4
    mcp_tools:
      - query_route_network
      - estimate_delay
      - query_alternative_routes
      - read_transport_disruptions

