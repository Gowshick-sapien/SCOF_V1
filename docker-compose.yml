services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: scof-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scof}
      POSTGRES_USER: ${POSTGRES_USER:-scof}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ./infrastructure/database/postgres/01_init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scof} -d ${POSTGRES_DB:-scof}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.18-community
    container_name: scof-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scof-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: scof-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  simulation:
    build:
      context: .
      dockerfile: services/simulation/Dockerfile
    container_name: scof-simulation
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-scof}
      - POSTGRES_USER=${POSTGRES_USER:-scof}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - SCOF_PROFILE_PATH=/app/profiles/mvp-electronics
    volumes:
      - ./profiles:/app/profiles

  demand-agent:
    build:
      context: .
      dockerfile: services/agents/demand/Dockerfile
    container_name: scof-demand-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-scof}
      - POSTGRES_USER=${POSTGRES_USER:-scof}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - SCOF_PROFILE_PATH=/app/profiles/mvp-electronics
      - NUMPY_SEED=42
      - XGBOOST_SEED=42
    ports:
      - "8011:8011"
    volumes:
      - ./profiles:/app/profiles:ro
      - ./models/demand:/app/models:rw

  inventory-agent:
    build:
      context: .
      dockerfile: services/agents/inventory/Dockerfile
    container_name: scof-inventory-agent
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-scof}
      - POSTGRES_USER=${POSTGRES_USER:-scof}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - SCOF_PROFILE_PATH=/app/profiles/mvp-electronics
      - NUMPY_SEED=42
      - XGBOOST_SEED=42
    ports:
      - "8012:8012"
    volumes:
      - ./profiles:/app/profiles:ro
      - ./models/inventory:/app/models:rw

  supplier-agent:
    build:
      context: .
      dockerfile: services/agents/supplier/Dockerfile
    container_name: scof-supplier-agent
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-scof}
      - POSTGRES_USER=${POSTGRES_USER:-scof}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - SCOF_PROFILE_PATH=/app/profiles/mvp-electronics
      - NUMPY_SEED=42
      - SKLEARN_SEED=42
    ports:
      - "8013:8013"
    volumes:
      - ./profiles:/app/profiles:ro
      - ./models/supplier:/app/models:rw

  transport-agent:
    build:
      context: .
      dockerfile: services/agents/transportation/Dockerfile
    container_name: scof-transport-agent
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-scof}
      - POSTGRES_USER=${POSTGRES_USER:-scof}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - SCOF_PROFILE_PATH=/app/profiles/mvp-electronics
      - NUMPY_SEED=42
      - SKLEARN_SEED=42
    ports:
      - "8014:8014"
    volumes:
      - ./profiles:/app/profiles:ro
      - ./models/transportation:/app/models:rw

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  kafka_data:

