[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scof-shared"
version = "0.1.0"
description = "SCOF Shared Utilities and Domain Profile Loaders"
authors = [{ name = "SCOF Team" }]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "neo4j>=5.18.0",
    "psycopg[binary]>=3.1.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
